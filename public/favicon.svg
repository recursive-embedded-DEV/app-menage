<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône de l'app M&M. Source unique : les icônes PNG de la PWA en sont générées
       par `npx pwa-assets-generator` (voir pwa-assets.config.ts). -->
  <!-- Carré plein, sans coins arrondis : iOS et Android appliquent leur propre forme. -->
  <rect width="512" height="512" fill="#1B3A5C"/>
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="'Arial Black', 'Segoe UI Black', Arial, Helvetica, sans-serif"
        font-weight="900" font-size="170" letter-spacing="-6" fill="#F4F1EA">M<tspan fill="#8DB8E8">&amp;</tspan>M</text>
</svg>
